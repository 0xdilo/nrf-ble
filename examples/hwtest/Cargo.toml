[package]
name = "nrf-ble-hwtest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nrf-ble = { path = "../..", default-features = false, features = ["nrf52811"] }
nrf52811-pac = "0.12.2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
rtt-target = "0.5"
panic-rtt-target = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
